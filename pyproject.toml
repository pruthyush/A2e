[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aee"
version = "0.1.0"
description = "Assurance Expiry Engine (AEE)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AEE Team" }
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "pytest-cov",
]

[project.scripts]
aee = "aee.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aee"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
